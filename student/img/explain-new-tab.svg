<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-label="ორი მდგომარეობა: ბმულზე დაწკაპუნებამდე ერთი ტაბია, target=&quot;_blank&quot;-ით დაწკაპუნების შემდეგ იხსნება მეორე ტაბი">
