  <text x="36" y="48" font-size="13" font-weight="700" class="mute">charset-ის გარეშე</text>
  <text x="36" y="104" font-size="19" class="mono">áƒ¥áƒáƒ áƒ—áƒ£áƒšáƒ˜</text>
  <text x="36" y="132" font-size="19" class="mono">áƒ”áƒœáƒ</text>
  <text x="36" y="164" font-size="13" class="mute">ასოები დაზიანებულია</text>
</g>
<path d="M280 100h0" stroke="none"/>
<g>
  <rect x="292" y="20" width="248" height="160" rx="10" fill="var(--wash)"/>
  <text x="308" y="48" font-size="13" font-weight="700" style="fill:var(--acc)">&lt;meta charset=&quot;UTF-8&quot;&gt;</text>
  <text x="308" y="112" font-size="30" font-weight="600">ქართული ენა</text>
  <text x="308" y="164" font-size="13" class="mute">ასოები სწორად ჩანს</text>
</g>
</svg>
