<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="ორი ბარათი: charset-ის გარეშე ქართული ტექსტი ირღვევა და ჩანს უაზრო სიმბოლოები; UTF-8-ით ჩანს „ქართული ენა“">
<style>
:root{--win:#fff;--bar:#e6ecee;--line:#cfd8db;--ink:#1e2f36;--mute:#6a7b82;--soft:#f0f3f4;--acc:#326273;--pac:#5c9ead;--tan:#e39774;--link:#2b6f84;--wash:#e1edf0;--mark:#f4d6c4}
