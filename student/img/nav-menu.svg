<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" aria-label="გვერდის ზედა მენიუ სამი ბმულით: Shortcuts, ცხრილი და MDN დოკუმენტაცია">
<style>
:root{--win:#fff;--bar:#e6ecee;--line:#cfd8db;--ink:#1e2f36;--mute:#6a7b82;--soft:#f0f3f4;--acc:#326273;--pac:#5c9ead;--tan:#e39774;--link:#2b6f84;--wash:#e1edf0;--mark:#f4d6c4}
@media (prefers-color-scheme:dark){:root{--win:#16252b;--bar:#1e3038;--line:#2c444d;--ink:#e6eef0;--mute:#97adb5;--soft:#1e3038;--acc:#8cc3d0;--link:#8cc3d0;--wash:#1d3a44;--mark:#6a4a3a}}
text{font-family:"Segoe UI","Noto Sans Georgian",Sylfaen,system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
.mute{fill:var(--mute)}
.link{fill:var(--link)}
</style>

<rect x=".5" y=".5" width="559" height="179" rx="12" fill="var(--win)" stroke="var(--line)"/>
<path d="M.5 40V12.5a12 12 0 0 1 12-12h535a12 12 0 0 1 12 12V40z" fill="var(--bar)"/>
<circle cx="22" cy="21" r="5" fill="var(--tan)"/><circle cx="40" cy="21" r="5" fill="#e6c27a"/><circle cx="58" cy="21" r="5" fill="var(--pac)"/>
<path d="M78 40v-18a9 9 0 0 1 9-9h150a9 9 0 0 1 9 9v18z" fill="var(--win)"/>
<text x="94" y="31" font-size="13.5">ჩემი გვერდი</text>
<rect x="262" y="10" width="278" height="22" rx="11" fill="var(--win)" stroke="var(--line)"/>
<text x="278" y="26" font-size="12" class="mute mono">index.html</text>

<rect x="24" y="68" width="512" height="48" rx="10" fill="var(--soft)"/>
<text x="44" y="98" font-size="17"><tspan class="link" text-decoration="underline">Shortcuts</tspan><tspan class="mute" xml:space="preserve">   |   </tspan><tspan class="link" text-decoration="underline">ცხრილი</tspan><tspan class="mute" xml:space="preserve">   |   </tspan><tspan class="link" text-decoration="underline">MDN დოკუმენტაცია</tspan></text>
<path d="M352 106l0 22 5.5-5 4 9.5 4-1.7-4-9.3 7.5 0z" fill="var(--ink)" stroke="var(--win)" stroke-width="1.5" stroke-linejoin="round"/>
<text x="24" y="156" font-size="13" class="mute">ბმულზე დაწკაპუნებისას უნდა გაიხსნას MDN-ის საიტი.</text>
</svg>
